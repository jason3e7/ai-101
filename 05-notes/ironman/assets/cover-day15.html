<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:78px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 15</span></div>
  <div>
    <h1>用 AI <em>拓展自己</em>: 5 個手段</h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="270" viewBox="0 0 1056 270">
    <!-- 5 rows of moves -->
    <!-- Row 1: 未知的未知 -->
    <circle cx="30" cy="20" r="18" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="27" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">1</text>
    <text x="66" y="27" fill="#f2f0ea" font-size="21" font-weight="700">未知的未知</text>
    <text x="240" y="27" fill="#a8aebd" font-size="16">問「我這程度不會想到要問什麼?」→ 破 blind spot</text>

    <!-- Row 2: 下一步階梯 -->
    <circle cx="30" cy="66" r="18" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="73" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">2</text>
    <text x="66" y="73" fill="#f2f0ea" font-size="21" font-weight="700">下一步階梯</text>
    <text x="240" y="73" fill="#a8aebd" font-size="16">問「懂了這個, 接下來該探索什麼?」→ 破學習天花板</text>

    <!-- Row 3: 借外領域 -->
    <circle cx="30" cy="112" r="18" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="119" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">3</text>
    <text x="66" y="119" fill="#f2f0ea" font-size="21" font-weight="700">借外領域視角</text>
    <text x="240" y="119" fill="#a8aebd" font-size="16">「生物學家 / 經濟學家會怎麼看?」→ 破學科慣性</text>

    <!-- Row 4: 主動找不舒服 -->
    <circle cx="30" cy="158" r="18" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="165" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">4</text>
    <text x="66" y="165" fill="#f2f0ea" font-size="21" font-weight="700">主動找不舒服</text>
    <text x="240" y="165" fill="#a8aebd" font-size="16">「給我最能反駁我的論點」→ 破同溫層</text>

    <!-- Row 5: 踩能力邊緣 (ZPD) -->
    <circle cx="30" cy="204" r="18" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="211" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">5</text>
    <text x="66" y="211" fill="#f2f0ea" font-size="21" font-weight="700">踩能力邊緣 (ZPD)</text>
    <text x="240" y="211" fill="#a8aebd" font-size="16">「出比我現在會的略難一點的題」→ 破停滯</text>

    <!-- Bottom warning: 放大器 -->
    <rect x="0" y="238" width="1056" height="32" rx="6" fill="#2a1818" stroke="#8b3535" stroke-width="1.5"/>
    <text x="20" y="259" fill="#e07a4a" font-size="15" font-weight="700">⚠ 前提: AI 是放大器</text>
    <text x="180" y="259" fill="#a8aebd" font-size="15">專家用 AI +45%, 一般人只 +20%  ·  0 × AI 還是 0, 得先有底子才放大得動</text>
  </svg>
  </div>
  <div class="foot">Day 11-14 教你「小心用」  ·  Day 15 教你「主動用」  ·  兩線合起來才完整</div>
</div></body></html>
