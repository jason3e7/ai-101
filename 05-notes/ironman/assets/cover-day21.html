<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:68px;font-weight:900;line-height:1.16;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:19px;color:#767d8d;letter-spacing:.04em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 21</span></div>
  <div>
    <h1>回到<em>好驗證</em>的主場</h1>
    <div class="sub">文字難驗, 程式好驗 — 差別在「有沒有Test Case」</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="210" viewBox="0 0 1056 210">
    <!-- 左: 文字產出 (難驗, 灰) -->
    <rect x="0" y="10" width="478" height="190" rx="16" fill="#ffffff05" stroke="#5b6170" stroke-width="2"/>
    <text x="30" y="52" fill="#a8aebd" font-size="23" font-weight="700">文字產出</text>
    <rect x="30" y="78"  width="300" height="12" rx="6" fill="#8b93a533"/>
    <rect x="30" y="102" width="340" height="12" rx="6" fill="#8b93a533"/>
    <rect x="30" y="126" width="250" height="12" rx="6" fill="#8b93a533"/>
    <circle cx="410" cy="100" r="36" fill="#14161f" stroke="#6b7280" stroke-width="3"/>
    <text x="410" y="115" fill="#8b93a5" font-size="44" font-weight="700" text-anchor="middle">?</text>
    <text x="30" y="170" fill="#8b93a5" font-size="17">錯了也靜靜躺著 — 沒 Test Case, 要人讀</text>

    <!-- 中: 回到主場的箭頭 -->
    <line x1="495" y1="105" x2="559" y2="105" stroke="#e8a13c" stroke-width="4"/>
    <polygon points="562,105 548,97 548,113" fill="#e8a13c"/>

    <!-- 右: 程式產出 (好驗, 金 + 綠色判決) -->
    <rect x="578" y="10" width="478" height="190" rx="16" fill="#e8a13c0a" stroke="#e8a13c55" stroke-width="2"/>
    <text x="608" y="52" fill="#e8a13c" font-size="23" font-weight="700">程式產出</text>
    <rect x="608" y="78"  width="300" height="12" rx="6" fill="#e8a13c33"/>
    <rect x="608" y="102" width="340" height="12" rx="6" fill="#e8a13c33"/>
    <rect x="608" y="126" width="250" height="12" rx="6" fill="#e8a13c33"/>
    <rect x="946" y="80" width="86" height="44" rx="10" fill="#2b8a3e" stroke="#40c057" stroke-width="2"/>
    <text x="989" y="111" fill="#eafff0" font-size="28" font-weight="900" text-anchor="middle">AC</text>
    <text x="608" y="170" fill="#a8aebd" font-size="17">跑一下就知道對不對 — Test Case說了算</text>
  </svg>
  </div>
  <div class="foot">實測 zerojudge : a001–a003 全 AC</div>
</div></body></html>
