<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:56px;font-weight:900;line-height:1.16;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:23px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:19px;color:#767d8d;letter-spacing:.04em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 27</span></div>
  <div>
    <h1>用 Claude Code 刷 CTF —<br><em>六類全部碰過, 剩下的卡點長什麼樣</em></h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="240" viewBox="0 0 1056 240">
    <!-- 左半: 每列 bar 長度 = 總題數, 填色 = 已解 (Day 26 深 + 本週新增橘) -->
    <!-- 11 px / 題; max = Web 26 總題 = 286 px -->
    <text x="0" y="22" fill="#8b93a5" font-size="16" font-weight="700">各類: 已解 / 總題數</text>

    <!-- Web: 20/26, Day26 solved 2, new 18 -->
    <text x="0" y="52" fill="#e8a13c" font-size="14" font-weight="900">Web</text>
    <rect x="110" y="42" width="286" height="14" rx="2" fill="#5b617033"/>
    <rect x="110" y="42" width="22" height="14" rx="2" fill="#5b6170"/>
    <rect x="132" y="42" width="198" height="14" rx="2" fill="#e8a13c"/>
    <text x="406" y="54" fill="#e8a13c" font-size="12" font-weight="700">20 / 26 (+18)</text>

    <!-- Pwn: 8/24, Day26 1, new 7 -->
    <text x="0" y="76" fill="#e8a13c" font-size="14" font-weight="900">Pwn</text>
    <rect x="110" y="66" width="264" height="14" rx="2" fill="#5b617033"/>
    <rect x="110" y="66" width="11" height="14" rx="2" fill="#5b6170"/>
    <rect x="121" y="66" width="77" height="14" rx="2" fill="#e8a13c"/>
    <text x="384" y="78" fill="#e8a13c" font-size="12" font-weight="700">8 / 24 (+7)</text>

    <!-- Reversing: 10/17, Day26 1, new 9 -->
    <text x="0" y="100" fill="#e8a13c" font-size="14" font-weight="900">Reversing</text>
    <rect x="110" y="90" width="187" height="14" rx="2" fill="#5b617033"/>
    <rect x="110" y="90" width="11" height="14" rx="2" fill="#5b6170"/>
    <rect x="121" y="90" width="99" height="14" rx="2" fill="#e8a13c"/>
    <text x="307" y="102" fill="#e8a13c" font-size="12" font-weight="700">10 / 17 (+9)</text>

    <!-- Crypto: 15/16, Day26 12, new 3 -->
    <text x="0" y="124" fill="#a8aebd" font-size="14" font-weight="700">Crypto</text>
    <rect x="110" y="114" width="176" height="14" rx="2" fill="#5b617033"/>
    <rect x="110" y="114" width="132" height="14" rx="2" fill="#5b6170"/>
    <rect x="242" y="114" width="33" height="14" rx="2" fill="#e8a13cb0"/>
    <text x="296" y="126" fill="#f2f0ea" font-size="12">15 / 16 (+3)</text>

    <!-- Misc: 7/14 -->
    <text x="0" y="148" fill="#a8aebd" font-size="14" font-weight="700">Misc</text>
    <rect x="110" y="138" width="154" height="14" rx="2" fill="#5b617033"/>
    <rect x="110" y="138" width="77" height="14" rx="2" fill="#5b6170"/>
    <text x="274" y="150" fill="#f2f0ea" font-size="12">7 / 14 (同 Day 26)</text>

    <!-- 小類合併 -->
    <text x="0" y="178" fill="#767d8d" font-size="12">Forensic 2/2 · Programming 1/1 · Lucky 1/1 (皆持平 · 已全解)</text>

    <!-- 圖例 -->
    <text x="0" y="212" fill="#767d8d" font-size="11">Day 26 已解</text>
    <rect x="86" y="204" width="12" height="10" rx="1" fill="#5b6170"/>
    <text x="110" y="212" fill="#767d8d" font-size="11">本週新增</text>
    <rect x="178" y="204" width="12" height="10" rx="1" fill="#e8a13c"/>
    <text x="210" y="212" fill="#767d8d" font-size="11">未解</text>
    <rect x="246" y="204" width="12" height="10" rx="1" fill="#5b617033" stroke="#5b6170" stroke-width="1"/>

    <!-- Divider -->
    <line x1="540" y1="0" x2="540" y2="220" stroke="#5b617033" stroke-width="1"/>

    <!-- 右半: hero 總分 + 六類全碰過 -->
    <text x="820" y="34" fill="#8b93a5" font-size="18" text-anchor="middle">總分</text>
    <text x="820" y="124" fill="#e8a13c" font-size="92" font-weight="900" text-anchor="middle">4940</text>
    <text x="820" y="152" fill="#8b93a5" font-size="16" text-anchor="middle">pts · 64 / 101 題</text>
    <text x="820" y="186" fill="#f2f0ea" font-size="20" font-weight="700" text-anchor="middle">除 Pwn / Web 難題外</text>
    <text x="820" y="212" fill="#e8a13c" font-size="18" font-weight="900" text-anchor="middle">六類全部碰過</text>
  </svg>
  </div>
</div></body></html>
