<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:66px;font-weight:900;line-height:1.1;letter-spacing:.02em;white-space:nowrap}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:18px;font-size:22px;color:#a8aebd;letter-spacing:.04em}
.foot{font-size:22px;color:#767d8d;letter-spacing:.08em}
.foot strong{color:#e8a13c;font-weight:900}

.art{position:absolute;right:72px;top:170px;z-index:3;
  font-family:"Noto Sans Mono CJK TC","DejaVu Sans Mono","Consolas",monospace;
  font-size:30px;line-height:1.05;letter-spacing:0;color:#e8a13c;
  white-space:pre;text-align:center}
.art .hat{color:#e8c784;font-size:28px;line-height:1.05}
.art .hat .band{color:#c8322a;font-weight:900}
.art .chest .lid{color:#b67821}
.art .chest .side{color:#8b5a2b}
.art .chest .gold{color:#fde8a8;font-weight:900}
.art .chest .coin{color:#ffd770;font-weight:900}
.art .chest .lock{color:#f2f0ea;font-weight:900}
.art .shine{color:#fde8a8aa;font-size:22px;margin-top:6px;letter-spacing:.4em}
</style></head><body>
<div class="grid"></div><div class="glow"></div>

<div class="art">
<span class="hat">     ╭─────╮
    ╱<span class="band">▓▓▓▓▓▓▓</span>╲
   ╭─────────╮
   ╰─────────╯</span>

<span class="chest"><span class="lid">   ╔═══════════╗
  ╔╝ ★  ◆  ★  ╚╗</span>
<span class="side">  ║ </span><span class="gold">● ●</span><span class="side"> </span><span class="lock">╔═╗</span><span class="side"> </span><span class="gold">● ●</span><span class="side"> ║
  ║ </span><span class="coin">◉ ◉</span><span class="side"> </span><span class="lock">║◉║</span><span class="side"> </span><span class="coin">◉ ◉</span><span class="side"> ║
  ║ </span><span class="gold">$ $ $</span><span class="side"> </span><span class="lock">╚═╝</span><span class="side"> </span><span class="gold">$ $</span><span class="side"> ║
  ╚═════════════╝</span>
<span class="shine">· ✦ · ✦ · ✦ ·</span>
</span>
</div>

<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 30 · Finale</span></div>
  <div>
    <h1>我把<em>所有財寶</em>都放在這了</h1>
    <div class="sub">三十天心法總結, 跟著 AI 持續成長</div>
  </div>
  <div class="foot">活到老 · 用到老 · <strong>用中學</strong></div>
</div>
</body></html>
