<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:linear-gradient(180deg,#0b1930 0%,#143352 55%,#1a4668 100%);
  color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.sun{position:absolute;width:900px;height:900px;right:-320px;top:-380px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c33 0%,#e8a13c12 36%,transparent 70%)}
.sparkle{position:absolute;border-radius:50%;background:#fde8a8;box-shadow:0 0 8px #fde8a8aa}
.sp1{width:4px;height:4px;left:860px;top:120px}
.sp2{width:3px;height:3px;left:1030px;top:220px}
.sp3{width:5px;height:5px;left:720px;top:60px}
.sp4{width:3px;height:3px;left:950px;top:360px}
.sp5{width:4px;height:4px;left:800px;top:420px}
.sp6{width:3px;height:3px;left:1080px;top:480px}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between;z-index:2}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
.title-wrap{position:relative;z-index:3}
h1{font-size:62px;font-weight:900;line-height:1.08;letter-spacing:.02em;white-space:nowrap;
  background:linear-gradient(180deg,#ffe9a8 0%,#e8a13c 55%,#b67821 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  text-shadow:0 2px 0 #00000030}
h1 em{font-style:normal;
  background:linear-gradient(180deg,#fde8a8 0%,#ffb347 55%,#8b4a0a 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.quote{margin-top:22px;font-size:22px;color:#c9d0dd;letter-spacing:.03em;font-style:italic;max-width:720px;line-height:1.5}
.quote strong{color:#e8a13c;font-style:normal}
.emoji-wrap{position:absolute;right:38px;bottom:20px;z-index:1;width:460px;height:460px;
  display:flex;align-items:center;justify-content:center}
.emoji-glow{position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle,#fde8a8aa 0%,#e8a13c66 32%,#e8a13c00 70%);
  filter:blur(6px)}
.emoji{position:relative;font-size:340px;line-height:1;z-index:2;
  font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;
  text-shadow:0 0 32px #fde8a8cc}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div>
<div class="sun"></div>
<div class="sparkle sp1"></div>
<div class="sparkle sp2"></div>
<div class="sparkle sp3"></div>
<div class="sparkle sp4"></div>
<div class="sparkle sp5"></div>
<div class="sparkle sp6"></div>

<div class="emoji-wrap">
  <div class="emoji-glow"></div>
  <div class="emoji">&#x1FA8E;</div>
</div>

<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 30 · Finale</span></div>
  <div class="title-wrap">
    <h1>我把<em>所有財寶</em>都放在這了</h1>
    <div class="quote">三十天心法總結, 跟著 AI 持續成長 — 活到老 · 用到老 · <strong>用中學</strong></div>
  </div>
  <div></div>
</div>
</body></html>
