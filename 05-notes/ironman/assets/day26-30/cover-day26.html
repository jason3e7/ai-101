<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:62px;font-weight:900;line-height:1.16;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:23px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:19px;color:#767d8d;letter-spacing:.04em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 26</span></div>
  <div>
    <h1>用 Claude Code 刷 CTF —<br><em>Please Hack Me 目前的測試狀況</em></h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="220" viewBox="0 0 1056 220">
    <!-- 左半: 已拿分數分布 (非 pass rate) -->
    <text x="0" y="22" fill="#8b93a5" font-size="16" font-weight="700">目前的測試狀況 (已拿分數)</text>

    <!-- Crypto 1000 pts -->
    <text x="0" y="56" fill="#e8a13c" font-size="15" font-weight="900">Crypto</text>
    <rect x="110" y="44" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="44" width="260" height="18" rx="3" fill="#e8a13c"/>
    <text x="378" y="58" fill="#e8a13c" font-size="13" font-weight="700">1000 pts</text>

    <!-- Misc 370 pts -->
    <text x="0" y="80" fill="#a8aebd" font-size="15" font-weight="700">Misc</text>
    <rect x="110" y="68" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="68" width="96" height="18" rx="3" fill="#e8a13cb0"/>
    <text x="378" y="82" fill="#f2f0ea" font-size="13">370 pts</text>

    <!-- Forensic 120 pts -->
    <text x="0" y="104" fill="#a8aebd" font-size="15" font-weight="700">Forensic</text>
    <rect x="110" y="92" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="92" width="31" height="18" rx="3" fill="#e8a13cb0"/>
    <text x="378" y="106" fill="#f2f0ea" font-size="13">120 pts</text>

    <!-- Lucky 110 pts -->
    <text x="0" y="128" fill="#a8aebd" font-size="15" font-weight="700">Lucky</text>
    <rect x="110" y="116" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="116" width="29" height="18" rx="3" fill="#e8a13cb0"/>
    <text x="378" y="130" fill="#f2f0ea" font-size="13">110 pts</text>

    <!-- Programming 40 pts -->
    <text x="0" y="152" fill="#a8aebd" font-size="15" font-weight="700">Programming</text>
    <rect x="110" y="140" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="140" width="10" height="18" rx="3" fill="#e8a13cb0"/>
    <text x="378" y="154" fill="#f2f0ea" font-size="13">40 pts</text>

    <!-- Reversing 40 pts -->
    <text x="0" y="176" fill="#a8aebd" font-size="15" font-weight="700">Reversing</text>
    <rect x="110" y="164" width="260" height="18" rx="3" fill="#5b617033"/>
    <rect x="110" y="164" width="10" height="18" rx="3" fill="#e8a13cb0"/>
    <text x="378" y="178" fill="#f2f0ea" font-size="13">40 pts</text>

    <!-- Web + Pwn 一行 -->
    <text x="0" y="200" fill="#767d8d" font-size="13">Web 30 pts · Pwn 10 pts (今天各試 1-2 題 sampler)</text>

    <!-- Divider -->
    <line x1="540" y1="0" x2="540" y2="210" stroke="#5b617033" stroke-width="1"/>

    <!-- 右半: hero 總分 -->
    <text x="820" y="34" fill="#8b93a5" font-size="18" text-anchor="middle">總分</text>
    <text x="820" y="130" fill="#e8a13c" font-size="104" font-weight="900" text-anchor="middle">1720</text>
    <text x="820" y="162" fill="#8b93a5" font-size="16" text-anchor="middle">pts</text>
    <text x="820" y="196" fill="#767d8d" font-size="13" text-anchor="middle">8 類全部有進度</text>
  </svg>
  </div>
</div></body></html>
