<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:82px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 09</span></div>
  <div>
    <h1>Loop <em>Engineering</em></h1>
    <div class="sub">給它一個測試, 讓它自己跑到過</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="200" viewBox="0 0 1056 200">
    <!-- Left panel: 你 (gold border 因為是你動的) -->
    <rect x="0" y="10" width="288" height="180" rx="10" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="144" y="40" fill="#e8a13c" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">你 (1 次)</text>
    <text x="144" y="86" fill="#f2f0ea" font-size="20" font-weight="700" text-anchor="middle">/goal</text>
    <text x="144" y="118" fill="#f2f0ea" font-size="17" text-anchor="middle">「所有測試通過」</text>
    <text x="144" y="158" fill="#a8aebd" font-size="15" text-anchor="middle">按 enter, 走人吃午餐</text>

    <!-- Arrow: 交出去 -->
    <text x="330" y="88" fill="#e8a13c" font-size="14" font-weight="700" text-anchor="middle">交出去</text>
    <line x1="298" y1="100" x2="358" y2="100" stroke="#e8a13c" stroke-width="3"/>
    <polygon points="362,100 350,94 350,106" fill="#e8a13c"/>

    <!-- Right panel: Agent 自動迴圈 -->
    <rect x="370" y="10" width="686" height="180" rx="10" fill="#1c1f2b" stroke="#3a4152" stroke-width="1.5"/>
    <text x="713" y="40" fill="#8b93a5" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2">Agent 自動迴圈 (N 輪, 你不在場)</text>

    <!-- 4 nodes in a loop, centered around x=560 -->
    <!-- 改 code (top-left) -->
    <rect x="430" y="66" width="120" height="42" rx="6" fill="#2a2e3a" stroke="#5a6275" stroke-width="1"/>
    <text x="490" y="93" fill="#c3c8d4" font-size="17" text-anchor="middle">改 code</text>

    <!-- 跑測試 (top-right) -->
    <rect x="620" y="66" width="120" height="42" rx="6" fill="#2a2e3a" stroke="#5a6275" stroke-width="1"/>
    <text x="680" y="93" fill="#c3c8d4" font-size="17" text-anchor="middle">跑測試</text>

    <!-- 讀 error (bottom-right) -->
    <rect x="620" y="132" width="120" height="42" rx="6" fill="#2a2e3a" stroke="#5a6275" stroke-width="1"/>
    <text x="680" y="159" fill="#c3c8d4" font-size="17" text-anchor="middle">讀 error</text>

    <!-- 修 (bottom-left) -->
    <rect x="430" y="132" width="120" height="42" rx="6" fill="#2a2e3a" stroke="#5a6275" stroke-width="1"/>
    <text x="490" y="159" fill="#c3c8d4" font-size="17" text-anchor="middle">修</text>

    <!-- Loop arrows: 改 → 跑 → 讀 → 修 → 改 -->
    <!-- 改 → 跑 (top) -->
    <line x1="552" y1="87" x2="618" y2="87" stroke="#5a6275" stroke-width="2"/>
    <polygon points="622,87 612,82 612,92" fill="#5a6275"/>

    <!-- 跑 → 讀 (right) -->
    <line x1="680" y1="110" x2="680" y2="130" stroke="#5a6275" stroke-width="2"/>
    <polygon points="680,134 675,124 685,124" fill="#5a6275"/>

    <!-- 讀 → 修 (bottom) -->
    <line x1="618" y1="153" x2="552" y2="153" stroke="#5a6275" stroke-width="2"/>
    <polygon points="548,153 558,148 558,158" fill="#5a6275"/>

    <!-- 修 → 改 (left) -->
    <line x1="490" y1="130" x2="490" y2="110" stroke="#5a6275" stroke-width="2"/>
    <polygon points="490,106 485,116 495,116" fill="#5a6275"/>

    <!-- Exit condition on right -->
    <text x="890" y="88" fill="#e8a13c" font-size="18" font-weight="700" text-anchor="middle">過了 → 自動停</text>
    <text x="890" y="118" fill="#a8aebd" font-size="15" text-anchor="middle">通知你回來看</text>

    <!-- Dashed arrow from loop exit to done -->
    <line x1="750" y1="110" x2="820" y2="95" stroke="#e8a13c" stroke-width="2" stroke-dasharray="5 4"/>
    <polygon points="825,93 815,92 819,101" fill="#e8a13c"/>
  </svg>
  </div>
  <div class="foot">你的 engineering 單位: 從「一句 prompt」擴到「一整條會自己驗完的流程」</div>
</div></body></html>
