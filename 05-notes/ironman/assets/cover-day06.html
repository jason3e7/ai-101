<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:82px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 06</span></div>
  <div>
    <h1>Prompt <em>Engineering</em></h1>
    <div class="sub">有效的技巧, 都在幫模型把機率分布縮到你要的那一區</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="196" viewBox="0 0 1056 196">
    <!-- 左欄標題：有效 -->
    <text x="60" y="30" fill="#e8a13c" font-size="26" font-weight="700" letter-spacing="2">✅ 有效</text>
    <line x1="60" y1="46" x2="480" y2="46" stroke="#e8a13c" stroke-width="1.5" opacity="0.35"/>

    <!-- 左欄項目 -->
    <text x="60" y="90" fill="#f2f0ea" font-size="28">給範例 (few-shot)</text>
    <text x="60" y="132" fill="#f2f0ea" font-size="28">明確的格式與長度</text>
    <text x="60" y="174" fill="#f2f0ea" font-size="28">指令與資料分開</text>

    <!-- 分隔線 -->
    <line x1="528" y1="14" x2="528" y2="188" stroke="#3a4152" stroke-width="1"/>

    <!-- 右欄標題：沒效 -->
    <text x="576" y="30" fill="#8b93a5" font-size="26" font-weight="700" letter-spacing="2">❌ 沒效</text>
    <line x1="576" y1="46" x2="996" y2="46" stroke="#5a6275" stroke-width="1.5" opacity="0.4"/>

    <!-- 右欄項目 -->
    <text x="576" y="90" fill="#8b93a5" font-size="28" text-decoration="line-through">給小費、威脅、情勒</text>
    <text x="576" y="132" fill="#8b93a5" font-size="28" text-decoration="line-through">扮專家 (客觀任務)</text>
    <text x="576" y="174" fill="#8b93a5" font-size="28" text-decoration="line-through">CoT 加在推理模型上</text>
  </svg>
  </div>
  <div class="foot">資料：Schulhoff 2024、Zheng 2024 (EMNLP)、Wharton 2025</div>
</div></body></html>
