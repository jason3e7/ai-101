<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:78px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 13</span></div>
  <div>
    <h1>AI 用久了, <em>驗證會鈍化</em></h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="190" viewBox="0 0 1056 190">
    <!-- Left panel: 急性 rubber-stamping (gold accent) -->
    <rect x="0" y="0" width="500" height="180" rx="10" fill="#2a2418" stroke="#e8a13c" stroke-width="2"/>
    <text x="30" y="34" fill="#e8a13c" font-size="15" font-weight="700" letter-spacing="2">急性</text>
    <text x="30" y="72" fill="#f2f0ea" font-size="30" font-weight="900">rubber-stamping</text>
    <text x="30" y="100" fill="#a8aebd" font-size="16">蓋章化, 單次連續就退化</text>

    <line x1="30" y1="118" x2="470" y2="118" stroke="#8b6a35" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="30" y="145" fill="#f2f0ea" font-size="16" font-weight="700">你以為在驗, 其實在點頭</text>
    <text x="30" y="167" fill="#a8aebd" font-size="14">NCT07328815 RCT: 醫師明知 AI 會錯, 仍照單全收</text>

    <!-- Bridge arrow between panels -->
    <text x="528" y="90" fill="#e8a13c" font-size="24" font-weight="700" text-anchor="middle">→</text>
    <text x="528" y="112" fill="#8b93a5" font-size="12" text-anchor="middle" letter-spacing="1">累積</text>

    <!-- Right panel: 慢性 cognitive offloading -->
    <rect x="556" y="0" width="500" height="180" rx="10" fill="#1c1f2b" stroke="#8b93a5" stroke-width="1.5"/>
    <text x="586" y="34" fill="#c3c8d4" font-size="15" font-weight="700" letter-spacing="2">慢性</text>
    <text x="586" y="72" fill="#f2f0ea" font-size="30" font-weight="900">cognitive offloading</text>
    <text x="586" y="100" fill="#a8aebd" font-size="16">認知外包, 長期依賴累積</text>

    <line x1="586" y1="118" x2="1026" y2="118" stroke="#3a4152" stroke-width="1" stroke-dasharray="3 3"/>

    <text x="586" y="145" fill="#f2f0ea" font-size="16" font-weight="700">神經連結 -55%, 「認知債」累積</text>
    <text x="586" y="167" fill="#a8aebd" font-size="14">MIT EEG 2025: 事後回想不出自己剛寫的東西</text>
  </svg>
  </div>
  <div class="foot">每次蓋章, 都在訓練下次更快蓋</div>
</div></body></html>
