<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:68px;font-weight:900;line-height:1.16;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:19px;color:#767d8d;letter-spacing:.04em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 22</span></div>
  <div>
    <h1>只下 prompt,<br>AI 自己解 <em>78 題</em> ZeroJudge</h1>
    <div class="sub">除了登入, 人不介入 · 基礎 / 競賽 / UVa 三題庫, 整體 AC 96.2%</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="210" viewBox="0 0 1056 210">
    <!-- 左半: 3 題庫 bars -->
    <text x="0" y="28" fill="#a8aebd" font-size="18" font-weight="700">基礎</text>
    <rect x="76" y="12" width="400" height="22" rx="4" fill="#5b617033"/>
    <rect x="76" y="12" width="381" height="22" rx="4" fill="#e8a13cd0"/>
    <text x="492" y="28" fill="#f2f0ea" font-size="18" font-weight="700">40 / 42</text>
    <text x="588" y="28" fill="#8b93a5" font-size="14">(95.2%)</text>

    <text x="0" y="78" fill="#a8aebd" font-size="18" font-weight="700">競賽</text>
    <rect x="76" y="62" width="400" height="22" rx="4" fill="#5b617033"/>
    <rect x="76" y="62" width="375" height="22" rx="4" fill="#e8a13cc0"/>
    <text x="492" y="78" fill="#f2f0ea" font-size="18" font-weight="700">15 / 16</text>
    <text x="588" y="78" fill="#8b93a5" font-size="14">(93.8%)</text>

    <text x="0" y="128" fill="#a8aebd" font-size="18" font-weight="700">UVa</text>
    <rect x="76" y="112" width="400" height="22" rx="4" fill="#5b617033"/>
    <rect x="76" y="112" width="400" height="22" rx="4" fill="#e8a13c"/>
    <text x="492" y="128" fill="#e8a13c" font-size="18" font-weight="900">20 / 20</text>
    <text x="588" y="128" fill="#e8a13c" font-size="14" font-weight="700">(100%)</text>

    <!-- Divider -->
    <line x1="720" y1="0" x2="720" y2="150" stroke="#5b617033" stroke-width="1"/>

    <!-- 右半: hero 96.2% -->
    <text x="890" y="30" fill="#8b93a5" font-size="18" text-anchor="middle">整體 AC</text>
    <text x="890" y="105" fill="#e8a13c" font-size="80" font-weight="900" text-anchor="middle">96.2%</text>
    <text x="890" y="135" fill="#8b93a5" font-size="16" text-anchor="middle">75 / 78 答題</text>

    <!-- 底部 context 條 -->
    <line x1="0" y1="170" x2="1056" y2="170" stroke="#5b617033" stroke-width="1"/>
    <text x="0" y="196" fill="#8b93a5" font-size="15">3 題待修 (樣例過但隱藏資沒過)  ·  4 題 AI 自己放棄  ·  單次送出, 不重試</text>
  </svg>
  </div>
  <div class="foot">實測 ZeroJudge: 基礎 / 競賽 / UVa 三題庫 (2026-10)</div>
</div></body></html>
