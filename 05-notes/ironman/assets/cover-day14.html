<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:78px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 14</span></div>
  <div>
    <h1>AI 抹平中產, <em>頂層反而變貴</em></h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="280" viewBox="0 0 1056 280">
    <!-- DIKW pyramid, left side -->

    <!-- Data (bottom, widest, grey) -->
    <polygon points="80,268 480,268 460,208 100,208" fill="#1c1f2b" stroke="#3a4152" stroke-width="1.5"/>
    <text x="280" y="245" fill="#8b93a5" font-size="17" font-weight="700" text-anchor="middle">Data · 資料</text>

    <!-- Information (grey) -->
    <polygon points="100,206 460,206 440,146 120,146" fill="#1c1f2b" stroke="#3a4152" stroke-width="1.5"/>
    <text x="280" y="183" fill="#8b93a5" font-size="17" font-weight="700" text-anchor="middle">Information · 資訊</text>

    <!-- Knowledge (middle, danger red — 中產被抹平) -->
    <polygon points="120,144 440,144 400,84 160,84" fill="#2a1818" stroke="#c74a4a" stroke-width="2.5"/>
    <text x="280" y="121" fill="#f2f0ea" font-size="19" font-weight="900" text-anchor="middle">Knowledge · 知識</text>

    <!-- Wisdom (top, gold — 頂層變貴) -->
    <polygon points="160,82 400,82 340,22 220,22" fill="#2a2418" stroke="#e8a13c" stroke-width="2.5"/>
    <text x="280" y="60" fill="#e8a13c" font-size="19" font-weight="900" text-anchor="middle">Wisdom · 智慧</text>

    <!-- Right side annotations -->
    <!-- Wisdom annotation -->
    <line x1="410" y1="52" x2="530" y2="52" stroke="#e8a13c" stroke-width="1.5"/>
    <text x="545" y="45" fill="#e8a13c" font-size="19" font-weight="900">頂層: 判斷力才是護城河</text>
    <text x="545" y="72" fill="#a8aebd" font-size="15">HBS/BCG: AI 錯的前沿, 新手 -19pp, 專家反而勝</text>

    <!-- Knowledge annotation -->
    <line x1="450" y1="114" x2="530" y2="114" stroke="#c74a4a" stroke-width="1.5"/>
    <text x="545" y="107" fill="#c74a4a" font-size="19" font-weight="900">中產: 這波 AI 抹平最徹底</text>
    <text x="545" y="134" fill="#a8aebd" font-size="15">「知道得多 ＋ 熟練套用」的舊護城河乾了</text>

    <!-- Info + Data grouped annotation -->
    <line x1="470" y1="207" x2="530" y2="207" stroke="#5a6275" stroke-width="1.5"/>
    <text x="545" y="200" fill="#8b93a5" font-size="19" font-weight="700">底層: 這層更早就攤平了</text>
    <text x="545" y="227" fill="#a8aebd" font-size="15">印刷 → 搜尋 → 直接問 AI, 門檻一路降</text>

    <!-- Summary caption at bottom -->
    <text x="545" y="266" fill="#f2f0ea" font-size="16" font-weight="700">上下擠壓 → 中產被夾殺</text>
  </svg>
  </div>
  <div class="foot">舊護城河 = 「知道得多」  ·  新護城河 = 「判斷得準」</div>
</div></body></html>
