<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:70px;font-weight:900;line-height:1.18;letter-spacing:.01em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:10px;margin-top:10px}
.axis{height:30px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 02</span></div>
  <div>
    <h1>不是它突然變強<br>是它<em>跨過了你的門檻</em></h1>
    <div class="sub">能力一路在指數成長，你只是現在才有感</div>
  </div>
  <div class="chartwrap">
  <div class="axis"></div>
  <svg width="1056" height="196" viewBox="0 0 1056 196">
    <!-- 門檻線 -->
    <line x1="0" y1="112" x2="1056" y2="112" stroke="#5a6275" stroke-width="2" stroke-dasharray="9 8"/>
    <text x="0" y="104" fill="#8b93a5" font-size="19">你開始覺得「有用」的門檻</text>

    <!-- 指數曲線 -->
    <path d="M6,190 C 400,188 620,180 780,152 C 868,136 918,106 992,56"
          fill="none" stroke="#e8a13c" stroke-width="5" stroke-linecap="round"/>
    <circle cx="866" cy="112" r="11" fill="#14161f" stroke="#e8a13c" stroke-width="5"/>

    <circle cx="140" cy="190" r="5" fill="#5a6275"/>
    <text x="140" y="152" fill="#6b7080" font-size="17" text-anchor="middle">GPT-2 · 2019</text>
    <text x="140" y="176" fill="#a8aebd" font-size="22" text-anchor="middle">3 秒</text>

    <circle cx="560" cy="183" r="5" fill="#5a6275"/>
    <text x="560" y="145" fill="#6b7080" font-size="17" text-anchor="middle">GPT-4 · 2023</text>
    <text x="560" y="169" fill="#a8aebd" font-size="22" text-anchor="middle">4 分鐘</text>

    <circle cx="956" cy="72" r="5" fill="#e8a13c"/>
    <text x="932" y="48" fill="#a08050" font-size="17" text-anchor="end">Claude Opus 4.5 · 2025</text>
    <text x="932" y="74" fill="#e8a13c" font-size="23" text-anchor="end">約 5 小時</text>
  </svg>
  </div>
  <div class="foot">縱軸：它能自己做完多久的工作　|　資料：METR</div>
</div></body></html>
