<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:82px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 07</span></div>
  <div>
    <h1>Context <em>Engineering</em></h1>
    <div class="sub">Prompt 只是它看到的 5%, 另外 95% 你也可以動</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="220" viewBox="0 0 1056 220">
    <!-- 說明 -->
    <text x="0" y="24" fill="#9aa0b0" font-size="20" font-weight="600">模型每一次讀到的 context window, 你打的那句只是最右邊那小格:</text>

    <!-- 指向 prompt 5% 的箭頭 -->
    <text x="925" y="76" fill="#e8a13c" font-size="20" font-weight="700" text-anchor="middle">你的 prompt</text>
    <line x1="925" y1="82" x2="925" y2="98" stroke="#e8a13c" stroke-width="2"/>
    <polygon points="925,102 919,92 931,92" fill="#e8a13c"/>

    <!-- Bar 底 -->
    <rect x="0" y="108" width="1056" height="72" fill="#1c1f2b" stroke="#3a4152" stroke-width="1"/>

    <!-- 系統 10% (0-105) -->
    <rect x="0" y="108" width="105" height="72" fill="#3a4152"/>
    <text x="52" y="150" fill="#c3c8d4" font-size="16" text-anchor="middle">系統規則</text>
    <text x="52" y="170" fill="#767d8d" font-size="14" text-anchor="middle">10%</text>

    <!-- 分隔 -->
    <line x1="105" y1="108" x2="105" y2="180" stroke="#14161f" stroke-width="2"/>

    <!-- 對話歷史 30% (105-421) -->
    <rect x="106" y="108" width="315" height="72" fill="#454c5f"/>
    <text x="263" y="150" fill="#c3c8d4" font-size="17" text-anchor="middle">對話歷史</text>
    <text x="263" y="170" fill="#767d8d" font-size="14" text-anchor="middle">30%</text>

    <line x1="421" y1="108" x2="421" y2="180" stroke="#14161f" stroke-width="2"/>

    <!-- 工具定義 15% (421-580) -->
    <rect x="422" y="108" width="158" height="72" fill="#3a4152"/>
    <text x="501" y="150" fill="#c3c8d4" font-size="16" text-anchor="middle">工具定義</text>
    <text x="501" y="170" fill="#767d8d" font-size="14" text-anchor="middle">15%</text>

    <line x1="580" y1="108" x2="580" y2="180" stroke="#14161f" stroke-width="2"/>

    <!-- 檔案 / RAG 30% (580-896) -->
    <rect x="581" y="108" width="315" height="72" fill="#454c5f"/>
    <text x="738" y="150" fill="#c3c8d4" font-size="17" text-anchor="middle">檔案 / RAG</text>
    <text x="738" y="170" fill="#767d8d" font-size="14" text-anchor="middle">30%</text>

    <line x1="896" y1="108" x2="896" y2="180" stroke="#14161f" stroke-width="2"/>

    <!-- Prompt 5% (896-949) - GOLD -->
    <rect x="897" y="108" width="52" height="72" fill="#e8a13c"/>
    <text x="923" y="152" fill="#14161f" font-size="22" font-weight="900" text-anchor="middle">5%</text>

    <line x1="949" y1="108" x2="949" y2="180" stroke="#14161f" stroke-width="2"/>

    <!-- 回應 10% (949-1056) -->
    <rect x="950" y="108" width="106" height="72" fill="#3a4152"/>
    <text x="1003" y="150" fill="#c3c8d4" font-size="16" text-anchor="middle">回應</text>
    <text x="1003" y="170" fill="#767d8d" font-size="14" text-anchor="middle">10%</text>

    <!-- 結論字 -->
    <text x="0" y="212" fill="#a8aebd" font-size="19" letter-spacing="1">Context Engineering = 主動設計那 95% 你以為只是背景的東西</text>
  </svg>
  </div>
  <div class="foot">依據：Karpathy、Anthropic、LangChain　|　比例為典型 Claude Code session 概估</div>
</div></body></html>
