<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:56px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:64px;font-weight:900;line-height:1.08;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.chartwrap{margin-bottom:4px;margin-top:4px}
.foot{font-size:17px;color:#767d8d;letter-spacing:.03em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 19</span></div>
  <div>
    <h1>浮水印怎麼運作,<br>為什麼<em>不能當證據</em></h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="290" viewBox="0 0 1056 290">
    <!-- Column headers -->
    <text x="20" y="22" fill="#9aa0b0" font-size="14" letter-spacing=".1em" font-weight="700">查到浮水印</text>
    <text x="556" y="22" fill="#9aa0b0" font-size="14" letter-spacing=".1em" font-weight="700">沒查到浮水印</text>

    <!-- Vertical divider -->
    <line x1="528" y1="36" x2="528" y2="148" stroke="#ffffff20" stroke-width="1"/>

    <!-- Big ≠ claim -->
    <text x="20" y="68" fill="#e8a13c" font-size="30" font-weight="900">≠ AI 寫的</text>
    <text x="556" y="68" fill="#ff7a4d" font-size="30" font-weight="900">≠ 人寫的</text>

    <!-- Supporting text -->
    <text x="20" y="105" fill="#a8aebd" font-size="17">可能只是拿 Claude 校對、翻譯、</text>
    <text x="20" y="130" fill="#a8aebd" font-size="17">改格式, 原作者仍是人</text>
    <text x="556" y="105" fill="#a8aebd" font-size="17">可能是舊模型、被改寫過、太短、</text>
    <text x="556" y="130" fill="#a8aebd" font-size="17">metadata 被剝除</text>

    <!-- Full horizontal divider -->
    <line x1="0" y1="172" x2="1056" y2="172" stroke="#ffffff20" stroke-width="1"/>

    <!-- 98% callout -->
    <text x="528" y="208" fill="#9aa0b0" font-size="15" text-anchor="middle" letter-spacing=".1em">更脆弱的是</text>
    <text x="528" y="252" fill="#ff7a4d" font-size="36" font-weight="900" text-anchor="middle">單次 paraphrase 移除 98% 浮水印</text>
    <text x="528" y="278" fill="#767d8d" font-size="13" text-anchor="middle">arXiv 2508.20228 · Google SynthID 實測</text>
  </svg>
  </div>
  <div class="foot">EU AI Act Article 50 (2026-08-02 生效) 推這一波 · 廠商被監管逼的, 不是良心發現</div>
</div></body></html>
