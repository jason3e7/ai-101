<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:56px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:64px;font-weight:900;line-height:1.08;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.chartwrap{margin-bottom:4px;margin-top:4px}
.foot{font-size:19px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 16</span></div>
  <div>
    <h1>掃<em>當屆所有文章</em>,<br>量一次「AI 味」有多少</h1>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="270" viewBox="0 0 1056 270">
    <!-- x-axis label -->
    <text x="280" y="0" fill="#767d8d" font-size="13" letter-spacing=".1em" dy="10">各組每千字 「——」次數 (加總再除)</text>

    <!-- Row 1: Claude AI (top, full gold) -->
    <text x="10" y="42" fill="#f2f0ea" font-size="19" font-weight="700">Claude AI</text>
    <rect x="280" y="24" width="440" height="22" fill="#e8a13c" rx="2"/>
    <text x="732" y="42" fill="#e8a13c" font-size="20" font-weight="900">1.78</text>

    <!-- Row 2: 佛心分享-IT 人自學之術 -->
    <text x="10" y="82" fill="#f2f0ea" font-size="19" font-weight="700">佛心分享-IT 人自學之術</text>
    <rect x="280" y="64" width="418" height="22" fill="#e8a13cd0" rx="2"/>
    <text x="732" y="82" fill="#e8a13c" font-size="20" font-weight="900">1.69</text>

    <!-- Row 3: Kubernetes -->
    <text x="10" y="122" fill="#f2f0ea" font-size="19" font-weight="700">Kubernetes</text>
    <rect x="280" y="104" width="361" height="22" fill="#e8a13c90" rx="2"/>
    <text x="732" y="122" fill="#e8a13c" font-size="20" font-weight="900">1.46</text>

    <!-- Divider -->
    <text x="10" y="166" fill="#767d8d" font-size="16" letter-spacing=".18em">中間 14 組省略  · · ·</text>

    <!-- Bottom row: ChatGPT & Codex -->
    <text x="10" y="220" fill="#ff7a4d" font-size="19" font-weight="700">ChatGPT &amp; Codex</text>
    <rect x="280" y="202" width="27" height="22" fill="#ff7a4d" rx="2"/>
    <text x="316" y="220" fill="#ff7a4d" font-size="20" font-weight="900">0.11</text>

    <!-- Annotation -->
    <text x="10" y="256" fill="#a8aebd" font-size="15">↑ GPT-5.1 (2025-11) 起可壓 em-dash, 這個指紋對 GPT 生態已在失效</text>
  </svg>
  </div>
  <div class="foot">全屆 814 系列 · 加總每千字 0.86 · 69.8% 文章零命中</div>
</div></body></html>
