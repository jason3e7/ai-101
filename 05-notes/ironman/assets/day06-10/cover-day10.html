<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Noto Sans CJK TC",sans-serif;
  background:#14161f;color:#f2f0ea;overflow:hidden;position:relative}
.grid{position:absolute;inset:0;
  background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);
  background-size:48px 48px}
.glow{position:absolute;width:760px;height:760px;right:-230px;top:-300px;border-radius:50%;
  background:radial-gradient(circle,#e8a13c26 0%,transparent 66%)}
.wrap{position:relative;padding:62px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px}
.mark{font-size:26px;font-weight:700;letter-spacing:.22em;color:#e8a13c}
.bar{width:2px;height:24px;background:#ffffff2e}
.day{font-size:21px;letter-spacing:.14em;color:#9aa0b0}
h1{font-size:82px;font-weight:900;line-height:1.05;letter-spacing:.005em}
h1 em{font-style:normal;color:#e8a13c}
.sub{margin-top:14px;font-size:24px;color:#a8aebd;letter-spacing:.03em}
.chartwrap{margin-bottom:6px;margin-top:6px}
.foot{font-size:20px;color:#767d8d;letter-spacing:.05em}
text{font-family:"Noto Sans CJK TC",sans-serif}
</style></head><body>
<div class="grid"></div><div class="glow"></div>
<div class="wrap">
  <div class="top"><span class="mark">AI 心法</span><span class="bar"></span><span class="day">Day 10</span></div>
  <div>
    <h1><em>xxx</em> Engineering</h1>
    <div class="sub">名字會變, 智慧是自己的</div>
  </div>
  <div class="chartwrap">
  <svg width="1056" height="260" viewBox="0 0 1056 260">
    <!-- L4: Loop (outermost, gold) -->
    <rect x="0" y="0" width="1056" height="260" rx="12" fill="none" stroke="#e8a13c" stroke-width="2"/>
    <text x="20" y="26" fill="#e8a13c" font-size="16" font-weight="700" letter-spacing="1">Loop Engineering  ·  2026  ·  一整條流程</text>

    <!-- L3: Harness -->
    <rect x="50" y="38" width="956" height="196" rx="10" fill="none" stroke="#8b93a5" stroke-width="1.5"/>
    <text x="70" y="62" fill="#c3c8d4" font-size="15" font-weight="700" letter-spacing="1">Harness Engineering  ·  2025-26  ·  一台跑每一輪的機器</text>

    <!-- L2: Context -->
    <rect x="130" y="72" width="796" height="140" rx="8" fill="none" stroke="#7a8296" stroke-width="1.5"/>
    <text x="150" y="96" fill="#a8aebd" font-size="15" font-weight="700" letter-spacing="1">Context Engineering  ·  2024-25  ·  一輪的完整輸入</text>

    <!-- L1: Prompt -->
    <rect x="220" y="106" width="616" height="88" rx="6" fill="none" stroke="#6b7285" stroke-width="1.5"/>
    <text x="240" y="128" fill="#9aa0b0" font-size="15" font-weight="700" letter-spacing="1">Prompt Engineering  ·  2020-23  ·  一句話</text>

    <!-- Core: LLM invariant -->
    <rect x="340" y="142" width="376" height="44" rx="6" fill="#2a2418" stroke="#e8a13c" stroke-width="1.5"/>
    <text x="528" y="171" fill="#e8a13c" font-size="18" font-weight="700" text-anchor="middle">LLM 猜下一個 token  ·  沒變過</text>
  </svg>
  </div>
  <div class="foot">四代疊加不是取代  ·  你動的單位一直往外退, 舊的智慧全帶得走</div>
</div></body></html>
